services:
  ollama:
    image: ollama/ollama:latest
    container_name: ec2-ai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models:ro
      - ./Modelfile:/project/Modelfile:ro
    # Keep Ollama accessible only from this machine.
    ports:
      - "127.0.0.1:11434:11434"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ec2-ai-api
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-drive-model}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
    depends_on:
      - ollama
    ports:
      # Keep the API private until we configure safe access in a later step.
      - "127.0.0.1:8000:8000"

volumes:
  ollama_data:
